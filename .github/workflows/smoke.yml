name: Arc Mainnet Smoke

on:
  push:
    branches: [main, arc-mainnet-microgrant]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Arc mainnet and Geomacro safety boundary
        env:
          GEOMACRO_BASE_URL: https://geomacro.live
          GEOMACRO_SCENARIO: USA>CHN
          GEOMACRO_POLICY: balanced
          GEOMACRO_ACTION_TYPE: agent_payment
          GEOMACRO_AMOUNT_USDC: "0.001"
          GEOMACRO_RECIPIENT: "0x1111111111111111111111111111111111111111"
          ARC_MAINNET_RPC_URL: https://rpc.mainnet.arc.io
          ARC_MAINNET_CHAIN_ID: "5042"
          ARC_MAINNET_EXPLORER: https://explorer.arc.io
        run: npm run smoke
